apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: child-guestbook
  namespace: codefresh
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: child-guestbook
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
